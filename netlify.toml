# Documentation: https://www.netlify.com/docs/netlify-toml-reference/

[build]
publish = "public"
command = "npm ci && npm run build:css && hugo --gc --minify"

[build.environment]
HUGO_VERSION = "0.161.1"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"
NODE_VERSION = "22"

[context.deploy-preview]
command = "npm ci && npm run build:css && hugo --gc --minify --buildFuture --baseURL $DEPLOY_PRIME_URL"
